<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 850" role="img" aria-labelledby="title desc">
  <title id="title">How2Shop store layout based on the supplied sketch</title>
  <desc id="desc">Butcher, deli and fish at the back left; cafe at the back right; nine upper aisles; six lower aisles; six checkouts; front-right entrance. Compact bathroom and rear support rooms are included.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #111; text-anchor: middle; dominant-baseline: middle; }
    .zone { fill: #bdbdbd; stroke: #555; stroke-width: 2; }
    .support { fill: #d3d3d3; stroke: #555; stroke-width: 2; }
    .label { font-size: 25px; }
    .small { font-size: 18px; }
    .tiny { font-size: 15px; }
  </style>
  <rect x="5" y="85" width="1245" height="695" fill="#242424" stroke="#444" stroke-width="5"/>

  <!-- Compact support rooms are behind the sales floor, outside the sketch's main rectangle. -->
